# L'archivio condiviso sveglio, ogni notte (dalla 0.107.0).
#
# Il piano gratuito di Supabase sospende il progetto dopo 7 giorni senza uso
# (docs/sostenibilita-free-tier.md), e l'app non risponde finché qualcuno non
# lo riprende a mano. Questo workflow lo tocca una volta al giorno: chiede
# soltanto se il servizio risponde, non legge dati e non salva niente.
#
# Su GitHub sta solo il codice (dalla 0.111.1): il repo è pubblico, e
# l'archivio e gli utenti non ci devono passare, nemmeno cifrati. Fino alla
# 0.111.0 lo stesso workflow salvava una copia del database fra gli artifact;
# la copia intera ora si fa dal proprio PC con supabase/backup.sh.
#
# Cosa impostare è nel manuale, cap. 31 («Supabase sveglio ogni notte»).
# Senza segreti il workflow lo dice e finisce verde: un repo senza archivio
# condiviso non deve ricevere un errore al giorno.
name: supabase-veglia

on:
  schedule:
    - cron: '17 3 * * *'   # ogni notte alle 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veglia:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Più organizzazioni, cioè più progetti (dalla 0.136.0): una riga per
      # progetto, «indirizzo chiave-pubblica» separati da uno spazio. Si
      # aggiunge a SUPABASE_URL e SUPABASE_KEY, che restano il primo.
      SUPABASE_PROGETTI: ${{ secrets.SUPABASE_PROGETTI }}
    steps:
      - name: Supabase sveglio
        run: |
          elenco=""
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then elenco="$SUPABASE_URL $SUPABASE_KEY"$'\n'; fi
          elenco+="$SUPABASE_PROGETTI"
          if [ -z "$(printf '%s' "$elenco" | tr -d '[:space:]')" ]; then
            echo "::notice::SUPABASE_URL o SUPABASE_KEY non impostati: nessun segnale a Supabase (manuale, cap. 31)."
            exit 0
          fi
          # Il log di un repo pubblico lo legge chiunque: i progetti si
          # chiamano per numero, mai per indirizzo.
          n=0; ko=0
          while read -r url chiave _; do
            [ -z "$url" ] && continue
            n=$((n + 1))
            if [ -z "$chiave" ]; then echo "::error::Progetto $n: manca la chiave pubblica dopo l'indirizzo."; ko=1; continue; fi
            echo "::add-mask::$url"
            codice=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
              -H "apikey: $chiave" "${url%/}/auth/v1/health") || true
            if [ "$codice" != 200 ]; then
              echo "::error::Progetto $n: Supabase risponde $codice, il progetto potrebbe essere sospeso. Riprendilo dal pannello di Supabase (Restore project)."
              ko=1
            else
              echo "Progetto $n: Supabase risponde."
            fi
          done <<< "$elenco"
          exit $ko
